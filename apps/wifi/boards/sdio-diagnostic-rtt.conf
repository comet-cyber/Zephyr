# Provide a second shell over J-Link RTT so diagnostics do not rely on UART pins.
CONFIG_USE_SEGGER_RTT=y
CONFIG_SHELL_BACKEND_RTT=y
# Keep the RTT shell off buffer 0, which is already used by RTT logging.
CONFIG_SHELL_BACKEND_RTT_BUFFER=1
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
# Route WHD's printf diagnostics to RTT while leaving the UART port untouched.
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y
