# 基础网络和 Infineon AIROC Wi-Fi 支持。
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_WIFI_AIROC=y

# IPv4 LAN connectivity for the Wi-Fi STA interface.
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_WIFI_STA_AUTO_DHCPV4=y

# 使用应用侧 custom resource 接口：固件从外部 OSPI Flash 读取。
# 不设置 CONFIG_CYW43438；custom 模式会关闭上游的固定芯片选择项。
CONFIG_AIROC_WIFI_CUSTOM=y

# Wi-Fi、网络和设备 Shell，便于首次启动观察和诊断。
CONFIG_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_SHELL=y

# Wi-Fi scan results arrive asynchronously; leave room for a burst while the
# shell prints them over UART.
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=32
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=100

# Scan callbacks format shell output in net_mgmt, not in the shell thread.
# The default 800-byte stack overflows on this Cortex-M85 debug build.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y

# AIROC/WHD 动态内存预算。
CONFIG_HEAP_MEM_POOL_SIZE=131072

# 保留外部 OSPI Flash 驱动和分区读取 API。
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_JESD216_API=y
CONFIG_FLASH_RENESAS_RA_OSPI_B=y
CONFIG_FLASH_SHELL=y
CONFIG_FLASH_SHELL_TEST_COMMANDS=n

# 直接从 UART 输出日志，便于捕获 Wi-Fi 初始化失败原因。
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_WIFI_LOG_LEVEL_INF=y
CONFIG_FLASH_LOG_LEVEL_DBG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_PRINTK=n

CONFIG_MAIN_STACK_SIZE=4096

# 当前应用不使用有线以太网，释放镜像空间和相关初始化路径。
CONFIG_ETH_RENESAS_RA_RMAC=n
CONFIG_MDIO_RENESAS_RA_RMAC=n
CONFIG_PHY_REALTEK_RTL8211F=n
